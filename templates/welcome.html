<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue – Espace IA</title>

  <style>
    /* === Arrière-plan visuel inspiré IA === */
    body {
      background: 
        linear-gradient(135deg, rgba(210,240,255,0.92), rgba(160,220,250,0.9)),
        url("https://cdn.pixabay.com/photo/2020/07/02/21/16/artificial-intelligence-5365358_1280.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      animation: fadeIn 1.5s ease forwards;
    }

    /* Animation légère de flottaison */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    /* === Carte centrale avec effet flottant === */
    .container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 50px 60px;
      width: 600px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease-in-out;
    }
    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
    }

    /* === Titre principal === */
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0077b6;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 span {
      font-size: 2.3rem;
      vertical-align: middle;
    }

    /* === Sous-titre === */
    p.subtitle {
      color: #555;
      margin-bottom: 35px;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
    }

    /* === Menu centré verticalement === */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* === Boutons modernes avec effet lumière === */
    button {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      width: 70%;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.25);
    }

    button:hover {
      background: linear-gradient(135deg, #0069d9, #004999);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 123, 255, 0.35);
    }

    button span {
      font-size: 1.3rem;
    }

    /* === Animation douce === */
    @keyframes buttonGlow {
      0% { box-shadow: 0 0 10px rgba(0, 140, 255, 0.4); }
      50% { box-shadow: 0 0 20px rgba(0, 140, 255, 0.7); }
      100% { box-shadow: 0 0 10px rgba(0, 140, 255, 0.4); }
    }

    /* === Responsive design === */
    @media (max-width: 600px) {
      .container {
        padding: 35px 25px;
      }
      button {
        width: 100%;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1><span>👋</span> Bienvenue dans ton espace IA</h1>
    <p class="subtitle">Choisis une expérience à explorer</p>

    <div class="menu">
      <button onclick="location.href='/predictor'">
        <span>🧠</span> Prédire un sentiment
      </button>

      <button onclick="location.href='/chatbot'">
        <span>💬</span> Chatbot émotionnel “Sentio”
      </button>

      <button onclick="location.href='/camera'">
        <span>🎥</span> Sentiment via caméra
      </button>
    </div>
  </div>
</body>
</html>
