<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue – Espace IA</title>
  <style>
    body {
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      font-family: "Poppins", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 50px 70px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #0077b6;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👋 Bienvenue dans ton espace IA</h1>
    <div class="menu">
      <button onclick="location.href='/predictor'">🧠 Prédire un sentiment</button>
      <button onclick="location.href='/chatbot'">💬 Chatbot émotionnel "Sentio" </button>
      <button onclick="location.href='/recommend'">🎯 Recommandation</button>
      <button onclick="location.href='/camera'">🎥 Sentiment via caméra</button>
    </div>
  </div>
</body>
</html>
