<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyse de Sentiment – Sentio</title>

  <style>
    /* === Arrière-plan avec dégradé IA === */
    body {
      background: 
        linear-gradient(135deg, rgba(210,240,255,0.92), rgba(160,220,250,0.9)),
        url("https://cdn.pixabay.com/photo/2020/07/02/21/16/artificial-intelligence-5365358_1280.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    /* === Carte principale === */
    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px 60px;
      width: 650px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease-in-out;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18);
    }

    /* === Bouton retour === */
    .back-btn {
      position: absolute;
      top: 25px;
      left: 25px;
    }

    .back-btn button {
      background: linear-gradient(135deg, #007bff, #0062cc);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.25);
    }

    .back-btn button:hover {
      background: linear-gradient(135deg, #0056b3, #003d7a);
      transform: scale(1.05);
    }

    /* === Titre === */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #003b73;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* === Zone de texte === */
    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 15px;
      outline: none;
      background-color: #f8fbff;
      transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    textarea:focus {
      border-color: #007bff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
    }

    /* === Boutons d’action === */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.25);
    }

    button:hover {
      background: linear-gradient(135deg, #0066d1, #004999);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 123, 255, 0.35);
    }

    /* === Résultats et recommandations === */
    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: 500;
      color: #333;
    }

    #recommendation {
      margin-top: 10px;
      font-size: 16px;
      color: #2d3436;
      font-style: italic;
    }

    #recButton {
      display: none;
      margin-top: 15px;
      background: linear-gradient(135deg, #28a745, #218838);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    #recButton:hover {
      background: linear-gradient(135deg, #1e7e34, #18692c);
      transform: scale(1.05);
    }

    /* === Responsive mobile === */
    @media (max-width: 600px) {
      .container {
        padding: 35px 25px;
      }
      button {
        width: 100%;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <div class="back-btn">
    <button onclick="window.location.href='/'">⬅️ Retour à l'accueil</button>
  </div>

  <div class="container">
    <h1>🧠 Analyse de Sentiment</h1>
    <p class="subtitle">Écrivez un commentaire ou choisissez un tweet depuis la base</p>

    <textarea id="textInput" placeholder="Saisissez ou sélectionnez un texte..."></textarea>

    <div class="btn-group">
      <button id="analyzeBtn">Analyser</button>
      <button id="loadBtn">Charger un tweet</button>
    </div>

    <div id="tweetSelectContainer" style="display: none;">
      <select id="tweetSelect">
        <option value="">Sélectionnez un tweet...</option>
      </select>
      <button id="confirmTweetBtn">✅ Valider</button>
    </div>

    <div id="result"></div>
    <button id="recButton">💡 Voir la recommandation</button>
    <div id="recommendation"></div>
  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const resultDiv = document.getElementById("result");
    const recDiv = document.getElementById("recommendation");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const loadBtn = document.getElementById("loadBtn");
    const tweetSelectContainer = document.getElementById("tweetSelectContainer");
    const tweetSelect = document.getElementById("tweetSelect");
    const confirmTweetBtn = document.getElementById("confirmTweetBtn");
    const recButton = document.getElementById("recButton");

    // === Charger un échantillon de tweets ===
    loadBtn.addEventListener("click", async () => {
      tweetSelectContainer.style.display = "block";
      tweetSelect.innerHTML = "<option value=''>Chargement...</option>";

      const response = await fetch("/tweets");
      const data = await response.json();
      tweetSelect.innerHTML = "<option value=''>Sélectionnez un tweet...</option>";

      data.tweets.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.text;
        opt.textContent = t.text.slice(0, 80) + "...";
        tweetSelect.appendChild(opt);
      });
    });

    confirmTweetBtn.addEventListener("click", () => {
      const selected = tweetSelect.value;
      if (selected) {
        textInput.value = selected;
        tweetSelectContainer.style.display = "none";
      }
    });

    // === Analyse du sentiment ===
    analyzeBtn.addEventListener("click", async () => {
      const text = textInput.value.trim();
      if (!text) {
        resultDiv.textContent = "⚠️ Veuillez saisir ou charger un texte avant d’analyser.";
        recDiv.textContent = "";
        recButton.style.display = "none";
        return;
      }

      resultDiv.textContent = "⏳ Analyse en cours...";
      recDiv.textContent = "";
      recButton.style.display = "none";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        if (data.error) {
          resultDiv.textContent = "Erreur : " + data.error;
          return;
        }

        const sentiment = data.sentiment_predicted;
        const confidence = data.confidence;
        const color =
          sentiment === "POSITIVE" ? "green" :
          sentiment === "NEGATIVE" ? "red" : "orange";

        resultDiv.innerHTML = `<span style="color:${color};font-weight:bold;">${sentiment}</span> (confiance : ${confidence})`;

        recButton.dataset.recommendation = data.recommendation || "Aucune recommandation disponible.";
        recButton.style.display = "inline-block";

      } catch (error) {
        resultDiv.textContent = "❌ Erreur d'analyse : " + error.message;
        recButton.style.display = "none";
      }
    });

    // === Afficher la recommandation ===
    recButton.addEventListener("click", () => {
      const recText = recButton.dataset.recommendation;
      recDiv.innerHTML = `💡 <strong>Recommandation :</strong> ${recText}`;
      recButton.style.display = "none";
    });
  </script>
</body>
</html>
