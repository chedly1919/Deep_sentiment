<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détection d’émotion – Sentio Live Cam</title>

  <style>
    /* === Fond animé harmonisé === */
    body {
      background: 
        linear-gradient(135deg, rgba(210,240,255,0.92), rgba(160,220,250,0.9)),
        url("https://cdn.pixabay.com/photo/2020/07/02/21/16/artificial-intelligence-5365358_1280.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      animation: fadeIn 1s ease forwards;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    /* === Carte principale === */
    .container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 45px 50px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      max-width: 720px;
      transition: all 0.3s ease;
    }
    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }

    /* === Bouton retour === */
    .back-btn {
      position: absolute;
      top: 25px;
      left: 25px;
    }
    .back-btn button {
      background: linear-gradient(135deg, #007bff, #005dc7);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
      transition: 0.3s;
    }
    .back-btn button:hover {
      background: linear-gradient(135deg, #005fc5, #004ba0);
      transform: scale(1.05);
    }

    /* === Titres === */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #003b73;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    p.subtitle {
      color: #555;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* === Zone vidéo / placeholder === */
    #videoContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      overflow: hidden;
      width: 560px;
      height: 420px;
      background: #e9f3fa;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      margin: 0 auto 25px auto;
    }
    .placeholder {
      color: #6c757d;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .placeholder span {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    /* === Bouton principal === */
    button.action {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      border: none;
      padding: 13px 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.25);
    }
    button.action:hover {
      background: linear-gradient(135deg, #0066d1, #004999);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 123, 255, 0.35);
    }

    /* === Message d’erreur === */
    .error {
      color: #d93025;
      font-weight: 500;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    /* === Responsive === */
    @media (max-width: 700px) {
      #videoContainer { width: 90%; height: 300px; }
      .container { padding: 35px 25px; }
    }
  </style>
</head>

<body>
  <div class="back-btn">
    <button onclick="window.location.href='/'">⬅️ Retour à l'accueil</button>
  </div>

  <div class="container">
    <h1>🎥 Détection d’émotion en direct</h1>
    <p class="subtitle">Analyse de ton humeur via la webcam en temps réel :</p>

    <div id="videoContainer">
      <div class="placeholder">
        <span>📷</span>
        <p>Caméra inactive — clique sur le bouton ci-dessous pour commencer</p>
      </div>
    </div>

    <button class="action" id="startBtn">Lancer la détection</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const videoContainer = document.getElementById("videoContainer");
    const errorMsg = document.getElementById("errorMsg");

    startBtn.addEventListener("click", async () => {
      try {
        const response = await fetch("/run_camera");
        const data = await response.json();

        if (data.status === "ok") {
          videoContainer.innerHTML =
            '<img src="/video_feed" width="560" style="border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.25);" />';
          errorMsg.textContent = "";
        } else {
          errorMsg.textContent = "⚠️ " + (data.message || "Impossible de démarrer la caméra.");
        }
      } catch (err) {
        errorMsg.textContent = "❌ Erreur : " + err.message;
      }
    });
  </script>
</body>
</html>
