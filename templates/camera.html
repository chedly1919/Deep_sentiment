<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détection d’émotion – Live Cam</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #e0f7fa, #80deea);
    }
    h1 {
      color: #007bff;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back {
      position: absolute;
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>
  <div class="back">
    <button onclick="window.location.href='/'">⬅️ Retour à l'accueil</button>
  </div>

  <h1>🎥 Détection d’émotion en direct</h1>
  <button onclick="launchCamera()">Lancer la détection</button>

  <script>
    function launchCamera() {
      fetch("/run_camera")
        .then(res => res.json())
        .then(data => alert(data.message))
        .catch(err => alert("Erreur : " + err));
    }
  </script>
</body>
</html>
